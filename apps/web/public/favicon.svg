<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>
      .pixel { shape-rendering: crispEdges; image-rendering: pixelated; }
    </style>
  </defs>
  <!-- Transparent background with embedded pixel-perfect 1:1 BvB icon -->
  <image href="/favicon.png" width="512" height="512" preserveAspectRatio="xMidYMid meet" style="image-rendering: pixelated; shape-rendering: crispEdges;" />
</svg>
