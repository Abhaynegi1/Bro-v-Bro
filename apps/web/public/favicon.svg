<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Outer Border for maximum contrast on both dark & light browser themes -->
  <rect x="2" y="3" width="28" height="26" rx="7" fill="#0A0E17" />
  
  <!-- LEFT JOY-CON (Player 1: Neon Crimson Red) -->
  <path d="M 9.5 4 L 14.5 4 L 14.5 28 L 9.5 28 C 5.5 28 3 25.5 3 21.5 L 3 10.5 C 3 6.5 5.5 4 9.5 4 Z" fill="#FF2E54" />
  
  <!-- RIGHT JOY-CON (Player 2: Neon Electric Cyan) -->
  <path d="M 17.5 4 L 22.5 4 C 26.5 4 29 6.5 29 10.5 L 29 21.5 C 29 25.5 26.5 28 22.5 28 L 17.5 28 Z" fill="#00E5FF" />
  
  <!-- CENTER SEAM (Dark Divider) -->
  <rect x="14.5" y="4" width="3" height="24" fill="#0A0E17" />

  <!-- === LEFT CONTROLS (Player 1) === -->
  <!-- Top Analog Stick (Bold White Ring + Inner Dot) -->
  <circle cx="8.5" cy="11.5" r="3.2" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="8.5" cy="11.5" r="1.5" fill="#0A0E17" />

  <!-- Bottom D-Pad (Crisp Directional Cross) -->
  <rect x="7.5" y="17.5" width="2" height="6" rx="0.5" fill="#FFFFFF" />
  <rect x="5.5" y="19.5" width="6" height="2" rx="0.5" fill="#FFFFFF" />

  <!-- Minus Button (-) -->
  <rect x="11.5" y="6.5" width="2.2" height="1" rx="0.5" fill="#0A0E17" />

  <!-- === RIGHT CONTROLS (Player 2) === -->
  <!-- Top 4 Action Buttons (Diamond cluster) -->
  <circle cx="23.5" cy="9.5" r="1.2" fill="#FFFFFF" />
  <circle cx="21" cy="12" r="1.2" fill="#FFFFFF" />
  <circle cx="26" cy="12" r="1.2" fill="#FFFFFF" />
  <circle cx="23.5" cy="14.5" r="1.2" fill="#FFFFFF" />

  <!-- Bottom Analog Stick (Bold White Ring + Inner Dot) -->
  <circle cx="23.5" cy="20.5" r="3.2" fill="#FFFFFF" filter="url(#shadow)" />
  <circle cx="23.5" cy="20.5" r="1.5" fill="#0A0E17" />

  <!-- Plus Button (+) -->
  <rect x="18.5" y="6.5" width="2" height="1" rx="0.3" fill="#0A0E17" />
  <rect x="19" y="6" width="1" height="2" rx="0.3" fill="#0A0E17" />
</svg>